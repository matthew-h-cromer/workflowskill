[project]
name = "workflowskill"
version = "0.7.1"
description = "Temporal-based workflow engine for agent automation"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9.0",
    "pyyaml>=6.0",
    "anthropic>=0.43.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openclaw = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.13.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
workflowskill = "workflowskill.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/workflowskill"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["cli/tests", "evals"]
markers = [
    "eval: LLM-based eval tests (run with: uv run pytest -m eval)",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "cli"
exclude = ["cli/tests", "evals"]

[tool.ruff]
line-length = 100
src = ["cli"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
